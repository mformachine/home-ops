---
# Shared by n8n (main) and n8n-worker deployments
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: n8n-prod
  annotations:
    # Never let Flux delete this volume (and its data) if the manifest is removed or renamed
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
