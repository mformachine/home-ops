---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app n8n
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: database
  interval: 30m
  path: ./kubernetes/apps/n8n-service/app
  postBuild:
    # Fills ${SECRET_*} placeholders from the SOPS-encrypted cluster-secrets
    # (kubernetes/apps/cluster-secrets.sops.yaml). If it's missing, the sync fails
    # instead of applying unfilled placeholders.
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: n8n-prod
  timeout: 5m
  wait: true
