---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # k3s-bundled Traefik is customised through this HelmChartConfig (kube-system)
  - ./traefik-config.yaml
  # SOPS-encrypted Cloudflare DNS token for Let's Encrypt DNS-01. prune: disabled.
  - ./cloudflare-api-token.sops.yaml
