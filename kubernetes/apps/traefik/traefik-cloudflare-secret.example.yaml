# EXAMPLE ONLY - placeholders, never put real values in this file.
# Name and key must match what traefik-config.yaml reads
# (secretKeyRef name: cloudflare-api-token, key: api-token).
# Before relying on this, confirm on the cluster:
#   kubectl get secret -n kube-system cloudflare-api-token -o jsonpath='{.data}' | jq 'keys'
# To manage it with Flux, copy to app/cloudflare-api-token.sops.yaml, fill in
# the real token, encrypt it (see docs/secrets.md) and add it to app/kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: kube-system
type: Opaque
stringData:
  api-token: "your-cloudflare-dns-edit-token"
