---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Every app below is managed by Flux. Add a new app as its own PR.
resources:
  - ./namespace.yaml
  # Encrypted values for ${SECRET_*} placeholders, used by the apps' postBuild
  - ./cluster-secrets.sops.yaml
  - ./stirling-pdf/ks.yaml
  - ./filebrowser/ks.yaml
  - ./observability/ks.yaml
  - ./longhorn-service/ks.yaml
  - ./traefik/ks.yaml
  - ./database/ks.yaml
  - ./n8n-service/ks.yaml
